# Build the site and publish it to GitHub Pages.
#
# Hugo is pinned to the version the site was verified against: a rebuild on
# 0.147.1 is byte-for-byte identical to what was being served, so an
# unexplained difference in the output means something. Letting the runner
# pick "latest" would throw that property away silently.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.147.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo
        run: |
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - uses: actions/checkout@v4
        # The theme is vendored, so there are no submodules to fetch and
        # nothing outside this repository is needed to build it.

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        # --baseURL from Pages, not from hugo.toml: on the github.io URL the
        # site must link to itself, or a standby copy would send every visitor
        # to the server it is standing in for. With a custom domain configured,
        # this resolves to that domain instead.
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
